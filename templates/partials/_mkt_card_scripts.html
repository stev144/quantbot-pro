{% load static %}
{# claude code changed: 2026-10-22 — card behaviour moved verbatim from markets.html (search filter, watchlist toggle, open workspace, live prices) so every page showing Markets cards behaves identically #}
<script>
var CSRF = '{{ csrf_token }}';
var WL_ADD_URL    = '{% url "watchlist_add" %}';
var WL_REMOVE_URL = '{% url "watchlist_remove" %}';

// ── Search filter ──────────────────────────────────────────────────────────
// claude code changed: 2026-10-26 — owner report: "BTCUSDT" matched nothing (cards say BTC_USDT / BTC/USDT), so every
// card vanished and only the Paper Trader card was left to tap. Now: separators and case are ignored on both sides
// (BTCUSDT = btc usdt = BTC-USDT = btc/usdt), forex full names count ("euro", "yen"), a match on the other tab
// switches to it, and an empty result says so. Returns the matching cards (watchlist row excluded).
function _mktNorm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function filterCards(q) {
    var n = _mktNorm(q);
    var hits = [], perPanel = {};
    document.querySelectorAll('.mkt-card').forEach(function(card) {
        var fx = card.querySelector('.fx-names');
        var hay = [card.dataset.symbol, card.dataset.display, card.dataset.name, fx ? fx.textContent : ''].map(_mktNorm).join('|');
        var match = !n || hay.indexOf(n) !== -1;
        card.style.display = match ? '' : 'none';
        if (match && !card.closest('.mkt-rail-section')) {
            hits.push(card);
            var panel = card.closest('[role="tabpanel"]');
            if (panel) perPanel[panel.id] = (perPanel[panel.id] || 0) + 1;
        }
    });
    document.documentElement.classList.toggle('mkt-searching', !!n);
    var msg = document.getElementById('mkt-no-match');
    if (msg) {
        msg.hidden = !(n && hits.length === 0);
        msg.textContent = 'No markets match "' + (q || '').trim() + '". Search by symbol (BTCUSDT, EUR/USD) or name (Bitcoin, Euro).';
    }
    var active = Array.prototype.find.call(document.querySelectorAll('[role="tabpanel"]'), function(p) { return p.style.display !== 'none'; });
    if (n && active && !perPanel[active.id]) {
        var other = Object.keys(perPanel)[0];
        var tab = other && document.querySelector('.mkt-tab[data-tab="' + other.replace('tab-', '') + '"]');
        if (tab) tab.click();   // markets.html's tab handler re-runs this filter on the new panel
    }
    return hits;
}
// Enter with exactly one match opens that market (claude code changed: 2026-10-26)
function mktOpenSingleMatch(q) {
    var hits = filterCards(q);
    if (hits.length === 1) mktOpenDetail(hits[0].dataset.symbol, hits[0].dataset['class']);
}
(function() {
    var box = document.getElementById('mkt-search');
    if (box) box.addEventListener('input', function() { filterCards(this.value); });
    if (box) box.addEventListener('keydown', function(e) { if (e.key === 'Enter') mktOpenSingleMatch(this.value); });   // claude code changed: 2026-10-26
})();

// ── Watchlist toggle ───────────────────────────────────────────────────────
function toggleWatchlist(btn) {
    if (btn.disabled) return;
    var symbol     = btn.dataset.symbol;
    var assetClass = btn.dataset['class'];
    var isActive   = btn.classList.contains('active');
    var url        = isActive ? WL_REMOVE_URL : WL_ADD_URL;
    btn.disabled = true;
    fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': CSRF},
        body: JSON.stringify({symbol: symbol, asset_class: assetClass}),
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        if (data.ok) {
            btn.classList.toggle('active');
            btn.textContent = btn.classList.contains('active') ? '♥' : '♡';
            btn.setAttribute('aria-label',
                btn.classList.contains('active') ? 'Remove from watchlist' : 'Add to watchlist');
        }
    })
    .catch(function() {})
    .finally(function() { btn.disabled = false; });
}

// ── Open the Market Intelligence workspace ────────────────────────────────
function mktOpenDetail(symbol, assetClass) {
    if ((assetClass === 'crypto' || assetClass === 'forex') && /^[A-Z0-9]{2,12}_[A-Z0-9]{2,6}$/.test(symbol)) {
        window.location.href = '/markets/' + assetClass + '/' + symbol + '/';
    }
}
</script>
<script src="{% static 'js/markets_live.js' %}" data-url="{% url 'markets_live' %}" defer></script>

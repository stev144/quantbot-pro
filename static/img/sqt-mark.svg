<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="Steph Quant Technologies">
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="7" fill="#1a3d72"/>

  <!-- Subtle grid lines -->
  <line x1="7" y1="27" x2="33" y2="27" stroke="rgba(255,255,255,0.10)" stroke-width="0.75"/>
  <line x1="7" y1="20" x2="33" y2="20" stroke="rgba(255,255,255,0.10)" stroke-width="0.75"/>
  <line x1="7" y1="13" x2="33" y2="13" stroke="rgba(255,255,255,0.10)" stroke-width="0.75"/>

  <!-- Secondary trace (echo / shadow line) -->
  <polyline points="7,30 13,23 19,26 25,14 33,10"
    stroke="#89b4ea" stroke-width="1.75" fill="none"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Primary equity curve — uptrend with one pullback -->
  <polyline points="7,28 14,20 20,23 27,11 33,8"
    stroke="white" stroke-width="2.5" fill="none"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- High-point dot -->
  <circle cx="33" cy="8" r="2.8" fill="#5b8dc9"/>

  <!-- Baseline -->
  <line x1="7" y1="33" x2="33" y2="33" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
</svg>
